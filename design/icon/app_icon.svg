    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C8BC2"/>
      <stop offset="1" stop-color="#3D679C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF5FA"/>
      <stop offset="1" stop-color="#D3E4F0"/>
    </linearGradient>
    <radialGradient id="skin" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#F8DCC3"/>
      <stop offset="0.65" stop-color="#EDBE9C"/>
      <stop offset="1" stop-color="#D99A74"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4A066"/>
      <stop offset="1" stop-color="#CF8048"/>
