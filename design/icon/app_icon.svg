    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D27A"/>
      <stop offset="1" stop-color="#DDB34F"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5E4A30" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5E4A30" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frontWindow">
      <path d="M300 286 L300 212 L340 212 C352 212 360 218 366 226 L410 286 Z"/>
    </clipPath>
  </defs>

  <!-- Фон: светлое небо, мягкое солнце, дорога -->
