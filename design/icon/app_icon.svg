  <path d="M296 290 L296 388" stroke="#355C8E" stroke-width="3" opacity="0.7"/>
  <path d="M182 290 L182 388" stroke="#355C8E" stroke-width="3" opacity="0.5"/>
  <rect x="314" y="306" width="22" height="6" rx="3" fill="#2F527F" opacity="0.8"/>
  <rect x="200" y="306" width="22" height="6" rx="3" fill="#2F527F" opacity="0.6"/>

