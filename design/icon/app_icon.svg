    <ellipse cx="322" cy="268" rx="6" ry="4" fill="#E79A88" opacity="0.45"/>
    <ellipse cx="355" cy="268" rx="6" ry="4" fill="#E79A88" opacity="0.45"/>
    <path d="M336 262 C335 267 335 269 339 270 C342 269 342 267 341 262" fill="#DDA07C"/>
    <path d="M328 274 C332 284 346 284 350 274 C344 277 334 277 328 274 Z" fill="#8A3A35"/>
    <path d="M330 275 C335 278 343 278 348 275 L347 278 C342 280 336 280 331 278 Z" fill="#FFFFFF"/>
